name: wrapsfer

services:
  keycloak-db:
    image: postgres:17
    container_name: wrapsfer-keycloak-db
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    ports:
      - "15433:5432"
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: wrapsfer-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_PARTNER_API_CLIENT_SECRET: ${KEYCLOAK_PARTNER_API_CLIENT_SECRET:-wrapsfer-secret}
      KEYCLOAK_OWNER_ADMIN_PASSWORD: ${KEYCLOAK_OWNER_ADMIN_PASSWORD:-ChangeMe-12345!}
    ports:
      - "18080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.2
    container_name: wrapsfer-keycloak-bootstrap
    restart: "no"
    entrypoint: ["/bin/bash", "/bootstrap/bootstrap-admin-client.sh"]
    environment:
      KC_BASE_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-wrapsfer-admin}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-wrapsfer-admin-secret}
    volumes:
      - ./keycloak/bootstrap-admin-client.sh:/bootstrap/bootstrap-admin-client.sh:ro
    depends_on:
      keycloak:
        condition: service_started

  wrapsfer-db:
    image: postgres:17
    container_name: wrapsfer-db
    environment:
      POSTGRES_USER: wrapsfer
      POSTGRES_PASSWORD: wrapsfer
      POSTGRES_DB: wrapsfer
    ports:
      - "15432:5432"
    volumes:
      - wrapsfer_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrapsfer"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: wrapsfer-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: wrapsfer
      RABBITMQ_DEFAULT_PASS: wrapsfer
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  keycloak_data:
  rabbitmq_data:
  wrapsfer_data:
